# Сервер Budmaster и его база. Секреты берутся из файла .env рядом (образец — .env.example).
#
#   docker compose up -d --build        запустить
#   docker compose run --rm backend create-owner --login ... --first-name ... --last-name ...
#   docker compose run --rm archiver      архивация (раз в месяц, по расписанию на сервере)
#
# Обратный прокси с HTTPS и резервные копии добавляются на этапе деплоя (docs/design.md, раздел 13).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budmaster_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: budmaster
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # База видна только с этого компьютера, не из сети.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budmaster_owner -d budmaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Применяет миграции под ролью-владельцем базы и задаёт пароль роли сервера. Отрабатывает и завершается.
  migrate:
    build: ./backend
    command: ["migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgres://budmaster_owner:${POSTGRES_PASSWORD}@postgres:5432/budmaster
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD в .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Сервер ходит в базу под ограниченной ролью: без DROP, без удаления и правки журнала.
      DATABASE_URL: postgres://budmaster_app:${APP_DB_PASSWORD}@postgres:5432/budmaster
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Адрес сервера, каким его видит браузер: из него строятся ссылки на фото.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?задайте PUBLIC_BASE_URL в .env}
    volumes:
      - media:/var/lib/budmaster/media
      # архивы сервер только читает (владелец смотрит их в приложении)
      - archive:/var/lib/budmaster/archive:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    # Потолок памяти сервера: даже при наплыве фото он не отнимет память у базы и системы.
    # Обработка фото берёт до 160 МБ на снимок, одновременно — не больше двух.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Архивация старых данных. Запускается вручную или по расписанию (cron) раз в месяц;
  # работает под ролью-владельцем базы — только она может убирать данные из неизменяемых таблиц.
  archiver:
    build: ./backend
    command: ["archive"]
    profiles: ["tools"]
    environment:
      MIGRATION_DATABASE_URL: postgres://budmaster_owner:${POSTGRES_PASSWORD}@postgres:5432/budmaster
    volumes:
      - archive:/var/lib/budmaster/archive
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  media:
  archive:
